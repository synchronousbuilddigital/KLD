<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="10" />
  <g id="water-bottle-dieline-geometry" transform="translate(35, 45)">
    <!-- Bleed Boundary (Green Dashed) -->
    <rect x="-8" y="-8" width="706" height="146" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="6,4" rx="2" />

    <!-- Glue Overlap Seam Tab Zone (Pale Blue Shading) -->
    <rect x="0" y="0" width="22" height="130" fill="#eff6ff" stroke="none" />
    <text x="11" y="70" font-family="system-ui, sans-serif" font-size="8" fill="#3b82f6" text-anchor="middle" transform="rotate(-90 11 70)">GLUE (6.35 mm)</text>

    <!-- Main Printable Label Area -->
    <text x="356" y="60" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#64748b" text-anchor="middle">500 mL PET MINERAL WATER BOTTLE WRAP LABEL</text>
    <text x="356" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Circumference: 243 mm (9.57 in) × Height: 46 mm (1.81 in) • Elongated 5.28:1 Ratio</text>

    <!-- Crease / Seam Line (Blue Dashed) -->
    <line x1="22" y1="0" x2="22" y2="130" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,3" />

    <!-- Outer Cut Path (Red Solid) -->
    <rect x="0" y="0" width="690" height="130" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linejoin="round" />
  </g>
</svg>
