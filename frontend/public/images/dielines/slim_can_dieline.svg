<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="10" />
  <g id="slim-can-dieline-geometry" transform="translate(45, 40)">
    <!-- Bleed Boundary (Green Dashed) -->
    <rect x="-8" y="-8" width="486" height="396" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="6,4" rx="2" />

    <!-- Top Neck Margin Guidelines Shading (Pale Amber/Blue) -->
    <rect x="0" y="0" width="470" height="36" fill="#f8fafc" stroke="none" />
    <text x="235" y="16" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">TOP CAN NECK CURVATURE MARGIN (8 mm / 14 mm)</text>

    <!-- Center Fold / Front & Back Division (Blue Dashed) -->
    <line x1="235" y1="0" x2="235" y2="380" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,3" />

    <!-- Top Neck Guide Crease Lines (Blue Dashed) -->
    <line x1="0" y1="20" x2="470" y2="20" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,2" />
    <line x1="0" y1="36" x2="470" y2="36" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="4,2" />

    <!-- Panel Labels -->
    <text x="117" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">FRONT PANEL (87.5 mm)</text>
    <text x="352" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#64748b" text-anchor="middle">BACK PANEL (87.5 mm)</text>
    <text x="235" y="235" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">355 mL / 250 mL SLIM ENERGY CAN</text>
    <text x="235" y="255" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Circumference: 175 mm (6.89 in) × Height: 145 mm (5.71 in)</text>

    <!-- Outer Cut Path (Red Solid) -->
    <rect x="0" y="0" width="470" height="380" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linejoin="round" />
  </g>
</svg>
