<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" rx="10" />
  <g id="can-dieline-geometry" transform="translate(40, 40)">
    <!-- Bleed Boundary (Green Dashed) -->
    <rect x="-8" y="-8" width="516" height="308" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="6,4" rx="2" />
    
    <!-- Glue Overlap Seam Tab Zone (Pale Blue Shading) -->
    <rect x="0" y="0" width="24" height="292" fill="#eff6ff" stroke="none" />
    <text x="12" y="150" font-family="system-ui, sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle" transform="rotate(-90 12 150)">GLUE OVERLAP SEAM (6.35 mm)</text>

    <!-- Main Printable Label Area -->
    <text x="262" y="145" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#64748b" text-anchor="middle">12 oz / 355 mL ALUMINUM CAN WRAP LABEL</text>
    <text x="262" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Circumference: 207 mm (8.15 in) × Height: 125 mm (4.92 in)</text>
    
    <!-- Crease / Seam Line (Blue Dashed) -->
    <line x1="24" y1="0" x2="24" y2="292" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,3" />

    <!-- Outer Cut Path (Red Solid) -->
    <rect x="0" y="0" width="500" height="292" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linejoin="round" />
  </g>
</svg>
