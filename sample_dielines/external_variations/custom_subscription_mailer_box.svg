<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <rect width="100%" height="100%" fill="#fdfbf7"/>
  <g fill="none" stroke="#059669" stroke-width="2">
    <!-- Roll-End Mailer Style Footprint with wide side wings -->
    <path d="M 120,50 L 480,50 L 480,120 L 550,120 L 550,330 L 480,330 L 480,400 L 120,400 L 120,330 L 50,330 L 50,120 L 120,120 Z" />
    <!-- Internal Fold Lines -->
    <g stroke="#dc2626" stroke-dasharray="5,5">
      <line x1="120" y1="120" x2="480" y2="120" />
      <line x1="120" y1="330" x2="480" y2="330" />
      <line x1="120" y1="120" x2="120" y2="330" />
      <line x1="480" y1="120" x2="480" y2="330" />
      <line x1="210" y1="120" x2="210" y2="330" />
      <line x1="390" y1="120" x2="390" y2="330" />
    </g>
  </g>
  <text x="300" y="230" font-family="sans-serif" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">ECO-SUBSCRIPTION MAILER (ROLL-END TRAY)</text>
</svg>
